<style>
:root{--vert:#2f6b3a;--vert-clair:#e5f1e6;--fond:#f7f5ef;--texte:#1d231e;--gris:#5b635c;--orange:#9a5b00;--orange-clair:#fff1db;--bord:#d6d9d2}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.45;color:var(--texte);background:var(--fond)}
header{background:var(--vert);color:#fff;padding:16px 16px 14px}
header h1{margin:0;font-size:1.5rem}
header p{margin:4px 0 0;font-size:.95rem;opacity:.95}
main{max-width:760px;margin:0 auto;padding:12px 12px 40px}
h2{font-size:1.15rem;margin:18px 0 8px}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-sol{min-height:64px;font-size:1.1rem;font-weight:700;border:2px solid var(--vert);border-radius:14px;background:#fff;color:var(--vert);padding:10px;cursor:pointer}
.btn-sol[aria-pressed="true"]{background:var(--vert);color:#fff}
.bascule{display:flex;border:2px solid var(--vert);border-radius:14px;overflow:hidden}
.bascule button{flex:1;min-height:52px;font-size:1.05rem;font-weight:600;border:0;background:#fff;color:var(--vert);cursor:pointer}
.bascule button[aria-pressed="true"]{background:var(--vert);color:#fff}
.options{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.filtre{display:flex;align-items:center;gap:12px;min-height:52px;background:#fff;border:2px solid var(--bord);border-radius:14px;padding:8px 14px;font-weight:600;cursor:pointer}
.filtre input{width:28px;height:28px;accent-color:var(--vert)}
#resume{margin:16px 0 8px;font-weight:600}
.desc-sol{color:var(--gris);font-size:.95rem;margin:0 0 8px}
.message{background:var(--orange-clair);border:2px solid #e2b66b;border-radius:14px;padding:14px;font-size:1.05rem}
ol#liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.carte{background:#fff;border:1px solid var(--bord);border-radius:14px;padding:14px}
.carte h3{margin:0;font-size:1.2rem}
.latin{color:var(--gris);font-style:italic;font-size:.9rem}
.ligne{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.eau{font-weight:700;border-radius:999px;padding:4px 12px;background:#e3eefb;color:#12436e}
.eau.inconnu{background:var(--orange-clair);color:var(--orange)}
.badge{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.badge.confirme{background:var(--vert-clair);color:var(--vert);border:1px solid #9cc8a3}
.badge.a_verifier{background:var(--orange-clair);color:var(--orange);border:1px solid #e2b66b}
.carte p{margin:6px 0}
.etiq{font-weight:700}
details{margin-top:8px;border-top:1px solid var(--bord);padding-top:6px}
summary{cursor:pointer;font-weight:700;color:var(--vert);min-height:44px;display:flex;align-items:center}
details ul{margin:4px 0;padding-left:20px}
details li{margin:4px 0}
.sources a{word-break:break-all;color:#1a4f8a}
footer{max-width:760px;margin:0 auto;padding:0 12px 30px;color:var(--gris);font-size:.85rem}
@media (min-width:700px){.grille{grid-template-columns:repeat(4,1fr)}.options{flex-direction:row}.options>*{flex:1}}
</style>
</head>

<header>

<main>
  <h2>1. Mon type de sol</h2>
  <div class="grille" id="sols">
    <button type="button" class="btn-sol" data-sol="argileux" aria-pressed="false">Argileux</button>
    <button type="button" class="btn-sol" data-sol="sableux" aria-pressed="false">Sableux</button>
    <button type="button" class="btn-sol" data-sol="rocheux" aria-pressed="false">Rocheux</button>
    <button type="button" class="btn-sol" data-sol="limoneux" aria-pressed="false">Limoneux</button>
  </div>
  <div class="options">
    <div class="bascule" role="group" aria-label="Version">
      <button type="button" data-mode="agriculteur" aria-pressed="true">🚜 Agriculteur</button>
      <button type="button" data-mode="jardinier" aria-pressed="false">🏡 Jardinier</button>
    </div>
    <label class="filtre"><input type="checkbox" id="normandie"> Normandie uniquement</label>
  </div>
  <div id="resultat" aria-live="polite">
    <p id="resume">Touchez un type de sol pour voir les plantes.</p>
    <p class="desc-sol" id="desc-sol"></p>
    <div id="message" class="message" hidden></div>
    <ol id="liste"></ol>
  </div>
</main>

true,"raison":null,"conseils":[]},"sources":["https://po.chambres-agriculture.fr/fileadmin/user_upload/267_chambre_dagriculture_-_pyrenees-orientales/FICHIERS/COLLECTIONS_DE_FICHIERS/PPAM_FICHES_TECHNIQUES/FT-Helichryse-AB_2020.pdf","https://www.franceagrimer.fr/sites/default/files/rdd/documents/focus_immortelle_HELICHRYSE_2.pdf"]}]}</script>
<script>
(function(){
  "use strict";
  var DONNEES = JSON.parse(document.getElementById("donnees-json").textContent);
  var PLANTES = Array.isArray(DONNEES.plantes) ? DONNEES.plantes : [];
  var ORDRE_EAU = {faible:0, modere:1, eleve:2};
  var LIB_EAU = {faible:"💧 Besoin en eau faible", modere:"💧💧 Besoin en eau modéré", eleve:"💧💧💧 Besoin en eau élevé"};
  var LIB_CONSEIL = {semis_plantation:"Semis / plantation", arrosage:"Arrosage", exposition:"Exposition", recolte:"Récolte", erreurs_a_eviter:"Erreurs à éviter", chaleur_et_gel:"Chaleur et gel"};
  var LIB_ASPECT = {temperatures:"Températures", pluie:"Pluie", secheresse:"Sécheresse", gel_tardif:"Gel tardif", canicule:"Canicule", regions_plus_favorables:"Régions plus favorables", regions_moins_favorables:"Régions moins favorables", evolution_2050:"Évolution 2050"};
  var etat = {sol:null, mode:"agriculteur", normandie:false};

  function esc(t){ return String(t == null ? "" : t).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function badge(s){ return s === "confirme" ? '<span class="badge confirme">✔ confirmé</span>' : '<span class="badge a_verifier">? à vérifier</span>'; }
  var NOMS_SOURCES = {"arvalis.fr":"Arvalis – Institut du végétal","arvalis.info":"Arvalis – Institut du végétal","terresinovia.fr":"Terres Inovia","inrae.fr":"INRAE","hal.inrae.fr":"INRAE (archive HAL)","prodinra.inra.fr":"INRA (ProdInra)","franceagrimer.fr":"FranceAgriMer","semae.fr":"SEMAE (interprofession des semences)","inao.gouv.fr":"INAO","extranet.inao.gouv.fr":"INAO","info.agriculture.gouv.fr":"Ministère de l'Agriculture","draaf.nouvelle-aquitaine.agriculture.gouv.fr":"DRAAF Nouvelle-Aquitaine","nouvelle-aquitaine.developpement-durable.gouv.fr":"DREAL Nouvelle-Aquitaine","aube.gouv.fr":"Préfecture de l'Aube","culture.gouv.fr":"Ministère de la Culture","meteofrance.com":"Météo-France","fao.org":"FAO (Nations unies)","opera-connaissances.chambres-agriculture.fr":"Chambres d'agriculture (OPERA)","aura.chambres-agriculture.fr":"Chambre d'agriculture Auvergne-Rhône-Alpes","po.chambres-agriculture.fr":"Chambre d'agriculture des Pyrénées-Orientales","hautsdefrance.chambres-agriculture.fr":"Chambre d'agriculture Hauts-de-France","saoneetloire.chambres-agriculture.fr":"Chambre d'agriculture de Saône-et-Loire","haute-loire.chambres-agriculture.fr":"Chambre d'agriculture de Haute-Loire","landes.chambres-agriculture.fr":"Chambre d'agriculture des Landes","charente.chambres-agriculture.fr":"Chambre d'agriculture de Charente","occitanie.chambres-agriculture.fr":"Chambre d'agriculture Occitanie","nouvelle-aquitaine.cnpf.fr":"CNPF Nouvelle-Aquitaine","dumas.ccsd.cnrs.fr":"CNRS (archive DUMAS)","repository.cimmyt.org":"CIMMYT","perspectives-agricoles.com":"Perspectives Agricoles (Arvalis)","snhf.org":"Société nationale d'horticulture de France","france3-regions.franceinfo.fr":"France 3 Régions","wiki.tripleperformance.fr":"Triple Performance","terre-net.fr":"Terre-net","web-agri.fr":"Web-agri","pleinchamp.com":"Pleinchamp","reussir.fr":"Réussir","gerbeaud.com":"Gerbeaud","labonnegraine.com":"La Bonne Graine","fermedesaintemarthe.com":"Ferme de Sainte Marthe","sdd8e85e78ed9d3dd.jimcontent.com":"Document en ligne (hébergeur Jimdo)"};
  function nomSource(u){
    var m = /^https?:\/\/([^\/?#]+)/i.exec(u); if(!m) return u;
    var h = m[1].toLowerCase().replace(/^www\./,"");
    return NOMS_SOURCES[h] || h;
  }
  function lienSur(u){ return esc(nomSource(u)); }
  function nomSol(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  function plantesDuSol(sol){
    var liste = PLANTES.filter(function(p){ return Array.isArray(p.sols) && p.sols.indexOf(sol) !== -1; });
    liste.sort(function(a, b){
      var ea = a.eau in ORDRE_EAU ? ORDRE_EAU[a.eau] : 99;
      var eb = b.eau in ORDRE_EAU ? ORDRE_EAU[b.eau] : 99;
      return ea !== eb ? ea - eb : a.nom.localeCompare(b.nom, "fr");
    });
    return liste;
  }

  function blocAgri(p){
    var a = p.agri || {}, h = "";
    h += '<p><span class="etiq">Revenu indicatif :</span> ' + (a.revenu ? esc(a.revenu) + (a.revenu_annee ? " (" + esc(a.revenu_annee) + ")" : "") + " " + badge(a.revenu_statut) : "non renseigné dans la base") + '</p>';
    if (a.rente) h += '<p><span class="etiq">Culture de rente</span> (valeur élevée par surface)</p>';
    var d = "";
    if (a.debouches && a.debouches.length) d += '<p><span class="etiq">Débouchés :</span> ' + esc(a.debouches.join(", ")) + '</p>';
    if (a.vigilance && a.vigilance.length) d += '<p class="etiq">Points de vigilance</p><ul>' + a.vigilance.map(function(v){ return '<li>' + esc(v.texte) + ' ' + badge(v.statut) + '</li>'; }).join("") + '</ul>';
    var clim = (a.risques || []).map(function(c){ return '<li><span class="etiq">' + esc(LIB_ASPECT[c.aspect] || c.aspect) + ' :</span> ' + esc(c.texte) + ' ' + badge(c.statut) + '</li>'; })
      .concat((a.opportunites || []).map(function(c){ return '<li><span class="etiq">Opportunité – ' + esc(LIB_ASPECT[c.aspect] || c.aspect) + ' :</span> ' + esc(c.texte) + ' ' + badge(c.statut) + '</li>'; }));
    if (clim.length) d += '<p class="etiq">Climat</p><ul>' + clim.join("") + '</ul>';
    if (d) h += '<details class="fiche"><summary>Fiche agriculteur</summary>' + d + '</details>';
    return h;
  }

  function blocJard(p){
    var j = p.jard || {}, h = "";
    h += '<p><span class="etiq">Jardin amateur :</span> ' + (p.jardin_amateur ? "adapté" : "peu adapté") + '</p>';
    if (!j.disponible) {
      h += '<p>' + esc(j.raison || "Pas de fiche jardinier pour cette plante.") + '</p>';
    } else if (!j.conseils || !j.conseils.length) {
      h += '<p>Conseils de jardinage non encore sourcés dans la base.</p>';
    } else {
      h += '<details class="fiche"><summary>Conseils jardinier (' + j.conseils.length + ')</summary><ul>' + j.conseils.map(function(c){ return '<li><span class="etiq">' + esc(LIB_CONSEIL[c.cle] || c.cle) + ' :</span> ' + esc(c.texte) + ' ' + badge(c.statut) + '</li>'; }).join("") + '</ul></details>';
    }
    return h;
  }

  function carte(p, sol){
    var ps = (p.par_sol && p.par_sol[sol]) || {statut:"a_verifier"};
    var eau = p.eau in LIB_EAU ? '<span class="eau">' + LIB_EAU[p.eau] + '</span>' + badge(p.eau_statut) : '<span class="eau inconnu">Besoin en eau à vérifier</span>';
    var h = '<li class="carte" data-id="' + esc(p.id) + '" data-eau="' + esc(p.eau || "") + '">';
    h += '<h3>' + esc(p.nom) + '</h3>' + (p.latin ? '<div class="latin">' + esc(p.latin) + '</div>' : "");
    h += '<div class="ligne">' + eau + '</div>';
    h += '<p><span class="etiq">Sol ' + esc(sol) + ' :</span> ' + esc(p.justification || "") + ' ' + badge(ps.statut) + '</p>';
    if (p.tolerance) h += '<p><span class="etiq">Eau / sécheresse :</span> ' + esc(p.tolerance) + ' ' + badge(p.eau_statut) + '</p>';
    if (p.regions && p.regions.length) h += '<p><span class="etiq">Régions favorables :</span> ' + esc(p.regions.join(", ")) + ' ' + badge(p.regions_statut) + '</p>';
    h += etat.mode === "jardinier" ? blocJard(p) : blocAgri(p);
    var src = p.sources || [];
    h += '<details class="sources"><summary>Sources (' + src.length + ')</summary><ul>' + src.map(function(u){ return '<li>' + lienSur(u) + '</li>'; }).join("") + '</ul></details>';
    return h + '</li>';
  }

  function afficher(){
    var liste = document.getElementById("liste"), msg = document.getElementById("message");
    var resume = document.getElementById("resume"), desc = document.getElementById("desc-sol");
    document.querySelectorAll(".btn-sol").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-sol") === etat.sol)); });
    document.querySelectorAll(".bascule button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === etat.mode)); });
    liste.innerHTML = ""; msg.hidden = true; msg.textContent = ""; desc.textContent = "";
    if (!etat.sol) { resume.textContent = "Touchez un type de sol pour voir les plantes."; return; }
    var plantes = plantesDuSol(etat.sol);
    desc.textContent = (DONNEES.sols && DONNEES.sols[etat.sol]) || "";
    if (!plantes.length) {
      resume.textContent = "Sol " + etat.sol + " : 0 plante";
      msg.textContent = "Données " + etat.sol + " en cours de vérification. Nous n'affichons que des plantes confirmées par des sources fiables : cette liste arrivera dans une prochaine version.";
      msg.hidden = false; return;
    }
    if (etat.normandie) plantes = plantes.filter(function(p){ return (p.regions || []).indexOf("Normandie") !== -1; });
    resume.textContent = "Sol " + etat.sol + " : " + plantes.length + " plante" + (plantes.length > 1 ? "s" : "") + (etat.normandie ? " citées pour la Normandie" : "") + " – classées du plus faible au plus fort besoin en eau";
    if (!plantes.length) { msg.textContent = "Aucune plante de ce sol n'a la Normandie parmi ses régions favorables dans la base."; msg.hidden = false; return; }
    liste.innerHTML = plantes.map(function(p){ return carte(p, etat.sol); }).join("");
  }

  document.getElementById("sols").addEventListener("click", function(e){
    var b = e.target.closest(".btn-sol"); if (!b) return;
    etat.sol = b.getAttribute("data-sol"); afficher();
  });
  document.querySelector(".bascule").addEventListener("click", function(e){
    var b = e.target.closest("button[data-mode]"); if (!b) return;
    etat.mode = b.getAttribute("data-mode"); afficher();
  });
  document.getElementById("normandie").addEventListener("change", function(e){ etat.normandie = e.target.checked; afficher(); });
  document.getElementById("pied").innerHTML = "Version gratuite – base vérifiée v" + esc(DONNEES.version) + " du " + esc(DONNEES.date) + " (" + PLANTES.length + " plantes). Badge « confirmé » : au moins deux sources distinctes dont une officielle ou une Chambre d'agriculture ; « à vérifier » : information à ne pas prendre pour un fait. Aucune donnée n'est envoyée : l'application fonctionne hors ligne.";
  afficher();
})();
</script>
<script>if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js");}</script>
</body>
